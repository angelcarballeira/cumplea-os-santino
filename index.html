<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/864/864763.png">

  <title>Cumpleaños de Santino</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="balloons">
    <div class="balloon balloon-1">🎈</div>
    <div class="balloon balloon-2">🎈</div>
    <div class="balloon balloon-3">🎈</div>
    <div class="balloon balloon-4">🎈</div>
  </div>

  <div class="confetti">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <main class="birthday-container">
    <h1>Santino</h1>
    <p id="subtitle" class="subtitle">Falta poco para tu cumpleaños 🎂</p>
    <section class="countdown">
      <div class="time-box"> <span id="days">00</span> <small>Días</small> </div>
      <div class="time-box"> <span id="hours">00</span> <small>Horas</small> </div>
      <div class="time-box"> <span id="minutes">00</span> <small>Minutos</small> </div>
      <div class="time-box"> <span id="seconds">00</span> <small>Segundos</small> </div>
    </section>

    <div id="birthday-message" class="birthday-message">
      <div class="celebration-emoji"> 🎉 🎂 🎉 </div>
      <h2>¡Feliz cumpleaños, Santino!</h2>
      <p>🥳 ¡Que tengas un día increíble! 🥳</p>
    </div>

    <p id="birthday-date" class="birthday-date">
      5 de octubre 🎉
    </p>
  </main>

  <script src="script.js"></script>
</body>

</html>
